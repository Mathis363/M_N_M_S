name: Keep bot awake

on:
  schedule:
    # Toutes les 10 minutes : Render met les services gratuits en veille
    # après 15 minutes sans trafic.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Réveiller et vérifier le bot
        run: |
          set -u
          URL="https://m-n-m-s-bot.onrender.com/health"
          code="000"
          for i in 1 2 3 4; do
            # 120 s : un service Render endormi met jusqu'à une minute à démarrer.
            code=$(curl -s -o /tmp/body.json -w "%{http_code}" -m 120 "$URL" || echo "000")
            echo "Tentative $i/4 -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Réponse :"
              cat /tmp/body.json || true
              exit 0
            fi
            sleep 30
          done
          echo "::error::Le bot ne répond pas (dernier code HTTP $code). Ouvre le tableau de bord Render et redémarre le service « m-n-m-s-bot »."
          exit 1
